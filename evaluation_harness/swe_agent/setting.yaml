# Defaults for the SWE-agent evaluation runner (run_infer.py). The model name is given
# on the command line (`--model`); everything else is read from here. Keys mirror
# SWEAgentPort's constructor arguments.
sweagent_dir: ../SWE-agent         # SWE-agent codebase (relative to the SusVibes repo root)
conda_env: sweagent1.1.0           # conda env with sweagent installed
config_name: [susvibes_eval, no_cache]   # SWE-agent config(s) under configs/, applied in order
num_workers: 8
prebuilt_agent_images: true      # run on images from ship_images.py (no egress needed); false = SWE-agent builds them
model:
  per_instance_cost_limit: 0.0     # 0 = unlimited
  per_instance_call_limit: 200
